<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XX & XX · 婚礼祝福墙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 18% 14%, rgba(216, 189, 115, 0.16), transparent 28%),
      radial-gradient(circle at 84% 20%, rgba(29, 103, 68, 0.36), transparent 32%),
      radial-gradient(circle at 52% 80%, rgba(216, 189, 115, 0.08), transparent 38%),
      linear-gradient(135deg, #020806 0%, #082016 36%, #04140f 70%, #010403 100%);
    overflow: hidden;
    font-family: 'Noto Serif SC', serif;
    color: #f8edd2;
    position: relative;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  body::before {
    z-index: 1;
    opacity: 0.36;
    background-image:
      url("data:image/svg+xml,%3Csvg width='760' height='420' viewBox='0 0 760 420' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d8bd73' stroke-width='1' stroke-opacity='.42'%3E%3Cpath d='M34 330C146 242 148 88 280 68c102-16 133 78 72 114-52 31-113 4-82-36 30-39 96-24 132 35 47 77 124 115 270 38'/%3E%3Cpath d='M85 108c58 33 92 21 132-18M547 286c61-8 91-38 116-84M185 283c46-14 71-41 83-80'/%3E%3Cpath d='M216 90c-18 3-35-3-50-18M266 205c-23 16-47 20-73 11M664 201c-17-2-31-10-41-25'/%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 760px 420px;
    mix-blend-mode: screen;
  }

  body::after {
    z-index: 2;
    background:
      radial-gradient(ellipse at center, transparent 0%, transparent 56%, rgba(0, 0, 0, 0.42) 100%),
      linear-gradient(90deg, rgba(216, 189, 115, 0.08), transparent 18%, transparent 82%, rgba(216, 189, 115, 0.08));
  }

  /* 背景粒子 */
  .particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 3;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0); }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-10vh) rotate(720deg) scale(1); }
  }

  /* 顶部标题 */
  .header {
    text-align: center;
    padding: 40px 20px 20px;
    position: relative;
    z-index: 10;
  }

  .header .names {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 4rem;
    background: linear-gradient(135deg, #fff2c6, #d8bd73 48%, #fff8df);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s ease-in-out infinite;
    letter-spacing: 8px;
    text-shadow: 0 0 28px rgba(216,189,115,0.18);
  }

  .header .name-text {
    display: inline;
  }

  @keyframes shimmer {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .header .subtitle {
    font-size: 1.2rem;
    color: rgba(248, 237, 210, 0.72);
    margin-top: 10px;
    letter-spacing: 6px;
  }

  .header .heart {
    width: clamp(92px, 15vw, 138px);
    height: auto;
    display: block;
    flex: 0 0 auto;
    overflow: visible;
    filter: drop-shadow(0 0 12px rgba(216,189,115,0.28));
  }

  .heart #line {
    fill: none;
    stroke: #d8bd73;
    stroke-width: 1.5;
    stroke-linecap: butt;
    stroke-linejoin: round;
    stroke-miterlimit: 4;
    stroke-opacity: 1;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: dash 3s linear infinite;
  }

  .heart #point {
    fill: none;
    stroke: #fff2c6;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-miterlimit: 0.1;
    stroke-opacity: 1;
    stroke-dasharray: 0.0001, 0.9999;
    stroke-dashoffset: 1;
    animation: dash 3s linear infinite;
  }

  @keyframes dash {
    0% {
      stroke-dashoffset: 1;
    }

    80%,
    100% {
      stroke-dashoffset: 0;
    }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.1); }
    50% { transform: scale(1); }
    75% { transform: scale(1.15); }
  }

  /* 飘动区域 */
  .float-area {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* 飘动的祝福卡片 */
  .float-card {
    position: absolute;
    background:
      linear-gradient(135deg, rgba(216,189,115,0.14), rgba(3,38,27,0.42)),
      rgba(255,255,255,0.035);
    border: 1px solid rgba(216,189,115,0.34);
    border-radius: 18px;
    padding: 18px 22px;
    backdrop-filter: blur(10px) saturate(1.1);
    pointer-events: auto;
    cursor: default;
    opacity: 0;
    max-width: 340px;
    box-shadow:
      0 10px 30px rgba(0,0,0,0.28),
      0 0 22px rgba(216,189,115,0.12),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .float-card .msg {
    font-size: 1rem;
    line-height: 1.6;
    color: #fff7df;
    margin-bottom: 8px;
    word-break: break-all;
  }

  .float-card .author {
    text-align: right;
    font-size: 0.85rem;
    color: rgba(216,189,115,0.78);
  }

  .float-card .author::before {
    content: '—— ';
  }

  /* 从右向左飘 */
  @keyframes floatLeft {
    0% {
      opacity: 0;
      transform: translateX(100vw) rotate(3deg) scale(0.8);
    }
    5% {
      opacity: 1;
      transform: translateX(90vw) rotate(2deg) scale(1);
    }
    90% {
      opacity: 0.9;
      transform: translateX(-10vw) rotate(-1deg) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateX(-30vw) rotate(-2deg) scale(0.8);
    }
  }

  /* 从左向右飘 */
  @keyframes floatRight {
    0% {
      opacity: 0;
      transform: translateX(-100vw) rotate(-3deg) scale(0.8);
    }
    5% {
      opacity: 1;
      transform: translateX(-90vw) rotate(-2deg) scale(1);
    }
    90% {
      opacity: 0.9;
      transform: translateX(10vw) rotate(1deg) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateX(30vw) rotate(2deg) scale(0.8);
    }
  }

  /* 从下往上飘 */
  @keyframes floatUpward {
    0% {
      opacity: 0;
      transform: translateY(100vh) translateX(0) rotate(2deg) scale(0.8);
    }
    5% {
      opacity: 1;
      transform: translateY(85vh) translateX(10px) rotate(1deg) scale(1);
    }
    50% {
      transform: translateY(40vh) translateX(-15px) rotate(-1deg) scale(1);
    }
    90% {
      opacity: 0.9;
      transform: translateY(-5vh) translateX(5px) rotate(1deg) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(-20vh) translateX(0) rotate(0deg) scale(0.8);
    }
  }

  .float-left {
    animation: floatLeft linear forwards;
  }

  .float-right {
    animation: floatRight linear forwards;
  }

  .float-up {
    animation: floatUpward linear forwards;
  }

  /* 新消息弹入闪光 */
  .float-card.new-glow {
    box-shadow:
      0 0 32px rgba(216,189,115,0.34),
      0 10px 30px rgba(0,0,0,0.28);
  }

  /* 底部二维码区域 */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 16px 18px 18px;
    background: linear-gradient(transparent, rgba(1,8,5,0.96));
    z-index: 10;
  }

  .footer .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .footer .action-btn {
    min-width: 112px;
    min-height: 42px;
    padding: 10px 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(216,189,115,0.38);
    border-radius: 999px;
    background: rgba(216,189,115,0.1);
    color: #fff2c6;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-decoration: none;
    backdrop-filter: blur(10px) saturate(1.1);
    transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }

  .footer .action-btn.primary {
    background: linear-gradient(135deg, rgba(216,189,115,0.28), rgba(10,61,42,0.34));
    border-color: rgba(255,242,198,0.5);
  }

  .footer .action-btn:hover {
    transform: translateY(-2px);
    background: rgba(216,189,115,0.2);
    border-color: rgba(255,242,198,0.66);
  }

  .footer .hint {
    display: none;
    font-size: 1.1rem;
    color: rgba(216,189,115,0.78);
    letter-spacing: 3px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .footer .count {
    display: none;
    font-size: 0.9rem;
    color: rgba(216,189,115,0.66);
    margin-top: 6px;
  }

  /* 空状态 */
  .empty-state {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(216,189,115,0.78);
    z-index: 10;
  }

  .empty-state .icon { font-size: 4rem; margin-bottom: 20px; }
  .empty-state .text { font-size: 1.3rem; letter-spacing: 2px; }
</style>
</head>
<body>

<!-- 背景粒子 -->
<div class="particles" id="particles"></div>

<!-- 标题 -->
<div class="header">
  <div class="names">
    <span class="name-text">XX</span>
    <svg
      class="heart"
      viewBox="-5 -5 278 56"
      version="1.1"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <filter id="heartBlur">
          <feGaussianBlur stdDeviation="1.6"></feGaussianBlur>
        </filter>
      </defs>
      <g transform="translate(29.1 -127.42)">
        <path
          pathLength="1"
          d="M-28.73 167.2c26.43 9.21 68.46-9.46 85.45-12.03 18.45-2.78 32.82 4.86 28.75 9.83-3.82 4.66-25.77-21.18-14.81-31.5 9.54-8.98 17.64 10.64 16.42 17.06-1.51-6.2 2.95-26.6 14.74-22.11 11.7 4.46-4.33 49.03-15.44 44.08-6.97-3.1 15.44-16.26 26.1-16 23.03.56 55.6 27.51 126.63 3.36"
          id="line"
        ></path>
      </g>
      <g transform="translate(29.1 -127.42)">
        <path
          pathLength="1"
          d="M-28.73 167.2c26.43 9.21 68.46-9.46 85.45-12.03 18.45-2.78 32.82 4.86 28.75 9.83-3.82 4.66-25.77-21.18-14.81-31.5 9.54-8.98 17.64 10.64 16.42 17.06-1.51-6.2 2.95-26.6 14.74-22.11 11.7 4.46-4.33 49.03-15.44 44.08-6.97-3.1 15.44-16.26 26.1-16 23.03.56 55.6 27.51 126.63 3.36"
          id="point"
          filter="url(#heartBlur)"
        ></path>
      </g>
    </svg>
    <span class="name-text">XX</span>
  </div>
  <div class="subtitle">永结同心 · 百年好合</div>
</div>

<!-- 空状态 -->
<div class="empty-state" id="empty">
  <div class="icon">💌</div>
  <div class="text">等待第一份祝福...</div>
</div>

<!-- 飘动区域 -->
<div class="float-area" id="floatArea"></div>

<!-- 底部 -->
<div class="footer">
  <div class="actions">
    <a class="action-btn" href="/welcome">← 返回欢迎页</a>
    <a class="action-btn primary" href="/write">✎ 写祝福</a>
    <a class="action-btn" href="/all-blessings">☰ 查看全部</a>
  </div>
  <div class="count" id="countText"></div>
</div>

<script>
  // 粒子
  function createParticles() {
    const c = document.getElementById('particles');
    const colors = ['#d8bd73','#fff2c6','#caa85d','#f4dfaa','#9b7b38','#efe4c1'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const s = Math.random() * 12 + 4;
      p.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${colors[i%colors.length]};animation-duration:${Math.random()*10+8}s;animation-delay:${Math.random()*15}s;`;
      c.appendChild(p);
    }
  }
  createParticles();

  const floatArea = document.getElementById('floatArea');
  const emptyEl = document.getElementById('empty');
  const countText = document.getElementById('countText');

  let allBlessings = [];
  let floatIndex = 0;
  let maxOnScreen = 8;
  let queue = [];
  let onScreen = 0;
  let lastId = 0; // 记录最新的祝福id，用于增量拉取

  // 创建飘动卡片
  function createFloatCard(blessing, isNew) {
    const card = document.createElement('div');
    card.className = 'float-card new-glow';

    // 随机垂直位置（避开顶部标题和底部）
    const topMin = 15;
    const topMax = 75;
    const top = Math.random() * (topMax - topMin) + topMin;
    card.style.top = top + '%';

    // 随机飘动方向
    const directions = ['float-left', 'float-right', 'float-up'];
    const dir = directions[Math.floor(Math.random() * directions.length)];

    // 随机动画时长（9-14秒，快速飘）
    const duration = Math.random() * 5 + 9;
    card.style.animationDuration = duration + 's';

    card.innerHTML = `
      <div class="msg">"${escapeHtml(blessing.message)}"</div>
      <div class="author">${escapeHtml(blessing.name)}</div>
    `;

    // 动画结束后移除，释放位置
    card.addEventListener('animationend', () => {
      card.remove();
      onScreen--;
      processQueue(); // 处理队列里的下一条
    });

    floatArea.appendChild(card);
    onScreen++;

    // 触发动画（需要下一帧才能生效）
    requestAnimationFrame(() => {
      card.classList.add(dir);
      card.style.opacity = '';
    });

    // 3秒后去掉闪光
    if (isNew) {
      setTimeout(() => card.classList.remove('new-glow'), 3000);
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // 处理队列
  function processQueue() {
    if (queue.length === 0 || onScreen >= maxOnScreen) return;
    const { blessing, isNew } = queue.shift();
    createFloatCard(blessing, isNew);
  }

  // 入队
  function enqueue(blessing, isNew) {
    queue.push({ blessing, isNew });
    processQueue();
  }

  // 循环飘动已有祝福
  function floatNext() {
    if (allBlessings.length === 0 || onScreen >= maxOnScreen) return;
    // 只从最近50条里循环
    const recent = allBlessings.slice(-50);
    const b = recent[floatIndex % recent.length];
    createFloatCard(b, false);
    floatIndex++;
  }

  // 首次加载：拉最近50条
  async function loadInitial() {
    try {
      const res = await fetch('/api/blessings?limit=50');
      const data = await res.json();
      const blessings = data.blessings;

      if (blessings.length === 0) {
        emptyEl.style.display = 'block';
        countText.textContent = '';
        return;
      }
      emptyEl.style.display = 'none';
      countText.textContent = `已收到 ${data.total} 条祝福`;

      allBlessings = blessings;
      lastId = blessings[blessings.length - 1].id;

      // 前3条立即飘出
      blessings.slice(-3).forEach((b, i) => {
        setTimeout(() => enqueue(b, false), i * 1500);
      });
    } catch (e) {
      console.error('加载失败:', e);
    }
  }

  // 增量拉取：只拉新祝福
  async function pollNew() {
    try {
      const res = await fetch(`/api/blessings?since=${lastId}`);
      const data = await res.json();
      const newOnes = data.blessings;

      if (newOnes.length > 0) {
        countText.textContent = `已收到 ${data.total} 条祝福`;
        allBlessings = [...allBlessings.slice(-100), ...newOnes];
        lastId = newOnes[newOnes.length - 1].id;
        emptyEl.style.display = 'none';

        // 新祝福排队飘出
        newOnes.forEach((b, i) => {
          setTimeout(() => enqueue(b, true), i * 1200);
        });
      }
    } catch (e) {}
  }

  // 首次加载
  loadInitial();

  // 每3秒增量检查新祝福
  setInterval(pollNew, 3000);

  // 每6秒循环飘一条旧祝福
  setInterval(floatNext, 6000);
</script>
</body>
</html>
