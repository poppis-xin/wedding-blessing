<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>王涛 & 鲁恬恬 · 婚礼祝福墙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html,
  body {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    background-color: #020806;
    background-image:
      radial-gradient(circle at 18% 14%, rgba(216, 189, 115, 0.16), transparent 28%),
      radial-gradient(circle at 84% 20%, rgba(29, 103, 68, 0.36), transparent 32%),
      radial-gradient(circle at 52% 80%, rgba(216, 189, 115, 0.08), transparent 38%),
      linear-gradient(135deg, #020806 0%, #082016 36%, #04140f 70%, #010403 100%);
    overflow: hidden;
    font-family: 'Noto Serif SC', serif;
    color: #f8edd2;
    position: relative;
  }

  .photo-bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: #020806;
  }

  .photo-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(circle at 50% 42%, rgba(0, 0, 0, 0.02), rgba(1, 20, 13, 0.16) 58%, rgba(0, 0, 0, 0.34) 100%),
      rgba(1, 20, 13, 0.18);
  }

  .photo-bg img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 18%;
    opacity: 0;
    filter: blur(0.6px) brightness(1.18) saturate(1.02) contrast(1.02);
    transform: scale(1.035);
    animation: photoFade 48s linear infinite;
    will-change: opacity;
  }

  .photo-bg img:nth-child(1) { animation-delay: 0s; }
  .photo-bg img:nth-child(2) { animation-delay: 6s; }
  .photo-bg img:nth-child(3) { animation-delay: 12s; }
  .photo-bg img:nth-child(4) { animation-delay: 18s; }
  .photo-bg img:nth-child(5) { animation-delay: 24s; }
  .photo-bg img:nth-child(6) { animation-delay: 30s; }
  .photo-bg img:nth-child(7) { animation-delay: 36s; }
  .photo-bg img:nth-child(8) { animation-delay: 42s; }

  @media (max-width: 520px) {
    .photo-bg img {
      object-position: center center;
    }
  }

  @keyframes photoFade {
    0% { opacity: 0; }
    3.7% { opacity: 1; }
    11.1% { opacity: 1; }
    14.8% { opacity: 0; }
    100% { opacity: 0; }
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  body::before {
    z-index: 1;
    display: none;
  }

  body::after {
    z-index: 2;
    background:
      radial-gradient(ellipse at center, transparent 0%, transparent 56%, rgba(0, 0, 0, 0.42) 100%),
      linear-gradient(90deg, rgba(216, 189, 115, 0.08), transparent 18%, transparent 82%, rgba(216, 189, 115, 0.08));
  }

  /* 背景粒子 */
  .particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 3;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0); }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-10vh) rotate(720deg) scale(1); }
  }

  /* 顶部标题 */
  .header {
    text-align: center;
    padding: 40px 20px 20px;
    position: relative;
    z-index: 10;
  }

  .header .names {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 0.8vw, 12px);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: clamp(1.05rem, 4.6vw, 2.45rem);
    background: linear-gradient(135deg, #fff2c6, #d8bd73 48%, #fff8df);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s ease-in-out infinite;
    letter-spacing: clamp(0px, 0.35vw, 2px);
    text-shadow: 0 0 28px rgba(216,189,115,0.18);
    white-space: nowrap;
    flex-wrap: nowrap;
    line-height: 1;
  }

  .header .name-text {
    display: inline;
    white-space: nowrap;
  }

  @keyframes shimmer {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .header .subtitle {
    font-size: 1.2rem;
    color: rgba(248, 237, 210, 0.72);
    margin-top: 10px;
    letter-spacing: 6px;
  }

  .header .heart {
    width: clamp(48px, 9vw, 88px);
    height: auto;
    display: block;
    flex: 0 0 auto;
    overflow: visible;
    filter: drop-shadow(0 0 12px rgba(216,189,115,0.28));
  }

  .heart #line {
    fill: none;
    stroke: #d8bd73;
    stroke-width: 1.5;
    stroke-linecap: butt;
    stroke-linejoin: round;
    stroke-miterlimit: 4;
    stroke-opacity: 1;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: dash 3s linear infinite;
  }

  .heart #point {
    fill: none;
    stroke: #fff2c6;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-miterlimit: 0.1;
    stroke-opacity: 1;
    stroke-dasharray: 0.0001, 0.9999;
    stroke-dashoffset: 1;
    animation: dash 3s linear infinite;
  }

  @keyframes dash {
    0% {
      stroke-dashoffset: 1;
    }

    80%,
    100% {
      stroke-dashoffset: 0;
    }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.1); }
    50% { transform: scale(1); }
    75% { transform: scale(1.15); }
  }

  /* 飘动区域 */
  .float-area {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* 飘动的祝福卡片 */
  .float-card {
    position: absolute;
    left: 0;
    top: 0;
    width: max-content;
    max-width: 300px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 18px;
    backdrop-filter: blur(6px) saturate(1.04);
    -webkit-backdrop-filter: blur(6px) saturate(1.04);
    pointer-events: auto;
    cursor: default;
    opacity: 0;
    box-shadow:
      0 8px 22px rgba(0,0,0,0.16),
      0 0 18px rgba(216,189,115,0.08),
      inset 0 1px 0 rgba(255,255,255,0.06);
    transform-origin: center;
    scale: 1;
    transform: translate3d(var(--card-x, 50vw), 110vh, 0);
    transition:
      scale 0.25s ease,
      box-shadow 0.25s ease,
      border-color 0.25s ease,
      background 0.25s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    will-change: transform, opacity;
  }

  .float-card.is-flying {
    animation: wishingFloat var(--float-duration, 20s) linear var(--float-delay, 0s) infinite;
  }

  .float-card .msg {
    font-size: 0.94rem;
    line-height: 1.58;
    color: rgba(255,248,223,0.94);
    margin-bottom: 7px;
    word-break: break-all;
  }

  .float-card .author {
    text-align: right;
    font-size: 0.76rem;
    color: rgba(216,189,115,0.58);
  }

  .float-card .author::before {
    content: '—— ';
  }

  @keyframes wishingFloat {
    0% {
      opacity: 0;
      transform: translate3d(var(--card-x, 50vw), 96vh, 0) rotate(-0.6deg) scale(0.96);
    }

    10% {
      opacity: 1;
      transform: translate3d(calc(var(--card-x, 50vw) + var(--drift-a, -10px)), 82vh, 0) rotate(0.5deg) scale(1);
    }

    50% {
      opacity: 0.96;
      transform: translate3d(calc(var(--card-x, 50vw) + var(--drift-b, 15px)), 50vh, 0) rotate(-0.5deg) scale(1);
    }

    90% {
      opacity: 1;
      transform: translate3d(calc(var(--card-x, 50vw) + var(--drift-c, -8px)), 18vh, 0) rotate(0.4deg) scale(1);
    }

    100% {
      opacity: 0;
      transform: translate3d(calc(var(--card-x, 50vw) + var(--drift-d, 10px)), 12vh, 0) rotate(0deg) scale(0.98);
    }
  }

  .float-card:hover,
  .float-card:focus {
    z-index: 30;
    scale: 1.06;
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255,255,255,0.14);
    box-shadow:
      0 14px 32px rgba(0,0,0,0.24),
      0 0 24px rgba(216,189,115,0.14),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* 新消息弹入闪光 */
  .float-card.new-glow {
    box-shadow:
      0 0 28px rgba(216,189,115,0.24),
      0 8px 24px rgba(0,0,0,0.22);
  }

  @media (max-width: 520px) {
    .header {
      padding: 26px 14px 14px;
    }

    .header .names {
      gap: 4px;
      font-size: clamp(1.02rem, 5vw, 1.55rem);
      letter-spacing: 0;
    }

    .header .heart {
      width: clamp(40px, 12vw, 58px);
    }

    .header .subtitle {
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .float-card {
      max-width: 40vw;
      padding: 10px 12px;
    }

    .float-card .msg {
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .float-card .author {
      font-size: 0.66rem;
    }
  }

  /* 底部二维码区域 */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 16px 18px 18px;
    background: linear-gradient(transparent, rgba(1,8,5,0.96));
    z-index: 10;
  }

  .footer .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .footer .action-btn {
    min-width: 112px;
    min-height: 42px;
    padding: 10px 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(216,189,115,0.38);
    border-radius: 999px;
    background: rgba(216,189,115,0.065);
    color: #fff2c6;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-decoration: none;
    backdrop-filter: blur(6px) saturate(1.04);
    transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }

  .footer .action-btn.primary {
    background: linear-gradient(135deg, rgba(216,189,115,0.18), rgba(10,61,42,0.2));
    border-color: rgba(255,242,198,0.38);
  }

  .footer .action-btn:hover {
    transform: translateY(-2px);
    background: rgba(216,189,115,0.12);
    border-color: rgba(255,242,198,0.48);
  }

  .footer .hint {
    display: none;
    font-size: 1.1rem;
    color: rgba(216,189,115,0.78);
    letter-spacing: 3px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .footer .count {
    display: none;
    font-size: 0.9rem;
    color: rgba(216,189,115,0.66);
    margin-top: 6px;
  }

  @media (max-width: 520px) {
    .footer {
      bottom: calc(18px + env(safe-area-inset-bottom));
      padding: 10px 10px 0;
      background: linear-gradient(transparent, rgba(1,8,5,0.46));
    }

    .footer .actions {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .footer .action-btn {
      flex: 1 1 0;
      min-width: 0;
      min-height: 44px;
      padding: 9px 6px;
      font-size: clamp(0.72rem, 3.15vw, 0.86rem);
      letter-spacing: 0;
      white-space: nowrap;
    }
  }

  /* 空状态 */
  .empty-state {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(216,189,115,0.78);
    z-index: 10;
  }

  .empty-state .icon { font-size: 4rem; margin-bottom: 20px; }
  .empty-state .text { font-size: 1.3rem; letter-spacing: 2px; }
</style>
</head>
<body>

<div class="photo-bg" aria-hidden="true">
  <img src="/assets/1.jpg" alt="" decoding="async">
  <img src="/assets/2.jpg" alt="" decoding="async">
  <img src="/assets/3.jpg" alt="" decoding="async">
  <img src="/assets/4.jpg" alt="" decoding="async">
  <img src="/assets/5.jpg" alt="" decoding="async">
  <img src="/assets/6.jpg" alt="" decoding="async">
  <img src="/assets/7.jpg" alt="" decoding="async">
  <img src="/assets/8.jpg" alt="" decoding="async">
</div>

<!-- 背景粒子 -->
<div class="particles" id="particles"></div>

<!-- 标题 -->
<div class="header">
  <div class="names">
    <span class="name-text">王涛</span>
    <svg
      class="heart"
      viewBox="-5 -5 278 56"
      version="1.1"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <filter id="heartBlur">
          <feGaussianBlur stdDeviation="1.6"></feGaussianBlur>
        </filter>
      </defs>
      <g transform="translate(29.1 -127.42)">
        <path
          pathLength="1"
          d="M-28.73 167.2c26.43 9.21 68.46-9.46 85.45-12.03 18.45-2.78 32.82 4.86 28.75 9.83-3.82 4.66-25.77-21.18-14.81-31.5 9.54-8.98 17.64 10.64 16.42 17.06-1.51-6.2 2.95-26.6 14.74-22.11 11.7 4.46-4.33 49.03-15.44 44.08-6.97-3.1 15.44-16.26 26.1-16 23.03.56 55.6 27.51 126.63 3.36"
          id="line"
        ></path>
      </g>
      <g transform="translate(29.1 -127.42)">
        <path
          pathLength="1"
          d="M-28.73 167.2c26.43 9.21 68.46-9.46 85.45-12.03 18.45-2.78 32.82 4.86 28.75 9.83-3.82 4.66-25.77-21.18-14.81-31.5 9.54-8.98 17.64 10.64 16.42 17.06-1.51-6.2 2.95-26.6 14.74-22.11 11.7 4.46-4.33 49.03-15.44 44.08-6.97-3.1 15.44-16.26 26.1-16 23.03.56 55.6 27.51 126.63 3.36"
          id="point"
          filter="url(#heartBlur)"
        ></path>
      </g>
    </svg>
    <span class="name-text">鲁恬恬</span>
  </div>
  <div class="subtitle">琴瑟和鸣 · 岁月静好</div>
</div>

<!-- 空状态 -->
<div class="empty-state" id="empty">
  <div class="icon">💌</div>
  <div class="text">等待第一份祝福...</div>
</div>

<!-- 飘动区域 -->
<div class="float-area" id="floatArea"></div>

<!-- 底部 -->
<div class="footer">
  <div class="actions">
    <a class="action-btn" id="backWelcomeLink" href="/welcome">← 返回欢迎页</a>
    <a class="action-btn primary" href="/write">✎ 写祝福</a>
    <a class="action-btn" href="/all-blessings">☰ 查看全部</a>
  </div>
  <div class="count" id="countText"></div>
</div>

<script>
  // 粒子
  function createParticles() {
    const c = document.getElementById('particles');
    const colors = ['#d8bd73','#fff2c6','#caa85d','#f4dfaa','#9b7b38','#efe4c1'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const s = Math.random() * 12 + 4;
      p.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${colors[i%colors.length]};animation-duration:${Math.random()*10+8}s;animation-delay:${Math.random()*15}s;`;
      c.appendChild(p);
    }
  }
  createParticles();

  const floatArea = document.getElementById('floatArea');
  const emptyEl = document.getElementById('empty');
  const countText = document.getElementById('countText');

  let allBlessings = [];
  let lastId = 0; // 记录最新的祝福id，用于增量拉取
  const MAX_CARDS = 14;
  const DESKTOP_TRACKS = [18, 34, 50, 66, 82];
  const MOBILE_TRACKS = [30, 70];
  const cardPool = [];
  const priorityBlessings = [];
  let blessingCursor = 0;

  function getNextBlessing() {
    if (priorityBlessings.length > 0) {
      return priorityBlessings.shift();
    }

    if (allBlessings.length === 0) return null;

    const blessing = allBlessings[blessingCursor % allBlessings.length];
    blessingCursor = (blessingCursor + 1) % allBlessings.length;
    return { blessing, isNew: false };
  }

  function randomInRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  function getTracks() {
    return window.innerWidth <= 520 ? MOBILE_TRACKS : DESKTOP_TRACKS;
  }

  function assignFlight(card, phase = null) {
    const next = getNextBlessing();
    if (!next) return;

    const { blessing, isNew } = next;
    const tracks = getTracks();
    const track = tracks[card._trackIndex % tracks.length];
    const x = track + randomInRange(-1.5, 1.5);
    const duration = 18;
    const delay = phase === null
      ? 0
      : -(duration * phase);

    card.querySelector('.msg').textContent = `"${blessing.message}"`;
    card.querySelector('.author').textContent = blessing.name;
    card.style.setProperty('--card-x', `calc(${x}vw - 50%)`);
    card.style.setProperty('--float-duration', `${duration}s`);
    card.style.setProperty('--float-delay', `${delay}s`);
    card.style.setProperty('--drift-a', `${randomInRange(-8, 8)}px`);
    card.style.setProperty('--drift-b', `${randomInRange(-10, 10)}px`);
    card.style.setProperty('--drift-c', `${randomInRange(-8, 8)}px`);
    card.style.setProperty('--drift-d', `${randomInRange(-6, 6)}px`);
    card.classList.toggle('new-glow', isNew);

    card.classList.remove('is-flying');
    card.style.opacity = '0';

    // 强制重排以重启动画；对象池只复用这些节点，不再创建海量 DOM。
    void card.offsetWidth;
    card.classList.add('is-flying');

    if (isNew) {
      setTimeout(() => card.classList.remove('new-glow'), 3000);
    }
  }

  function initCardPool() {
    if (cardPool.length > 0) return;

    for (let i = 0; i < MAX_CARDS; i++) {
      const card = document.createElement('div');
      card.className = 'float-card';
      card.tabIndex = 0;
      card._poolIndex = i;
      card._trackIndex = i;
      card.innerHTML = `
        <div class="msg"></div>
        <div class="author"></div>
      `;
      card.addEventListener('animationiteration', () => assignFlight(card));
      floatArea.appendChild(card);
      cardPool.push(card);
    }
  }

  function startCardPool() {
    initCardPool();
    cardPool.forEach((card, index) => {
      const phase = (index / cardPool.length) + randomInRange(-0.006, 0.006);
      assignFlight(card, Math.min(Math.max(phase, 0), 0.96));
    });
  }

  // 首次加载：拉最近50条
  async function loadInitial() {
    try {
      const res = await fetch('/api/blessings?limit=50');
      const data = await res.json();
      const blessings = data.blessings;

      if (blessings.length === 0) {
        emptyEl.style.display = 'block';
        countText.textContent = '';
        return;
      }
      emptyEl.style.display = 'none';
      countText.textContent = `已收到 ${data.total} 条祝福`;

      allBlessings = blessings;
      lastId = blessings[blessings.length - 1].id;

      blessingCursor = 0;
      startCardPool();
    } catch (e) {
      console.error('加载失败:', e);
    }
  }

  // 增量拉取：只拉新祝福
  async function pollNew() {
    try {
      const res = await fetch(`/api/blessings?since=${lastId}`);
      const data = await res.json();
      const newOnes = data.blessings;

      if (newOnes.length > 0) {
        countText.textContent = `已收到 ${data.total} 条祝福`;
        allBlessings = [...allBlessings.slice(-100), ...newOnes];
        lastId = newOnes[newOnes.length - 1].id;
        emptyEl.style.display = 'none';

        newOnes.forEach((blessing) => {
          priorityBlessings.push({ blessing, isNew: true });
        });
      }
    } catch (e) {}
  }

  // 首次加载
  loadInitial();

  // 每3秒增量检查新祝福
  setInterval(pollNew, 3000);

  const backWelcomeLink = document.getElementById('backWelcomeLink');
  if (backWelcomeLink) {
    backWelcomeLink.addEventListener('click', (event) => {
      event.preventDefault();
      if (window.self === window.top) {
        window.location.href = '/welcome';
        return;
      }
      window.parent.postMessage({ type: 'navigate-shell', href: '/welcome' }, '*');
    });
  }

</script>
<audio id="bgMusic" loop>
  <source src="/assets/交换余生.mp3" type="audio/mpeg">
</audio>
<script src="/music.js"></script>
</body>
</html>
