<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部祝福 - XX & XX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 18% 12%, rgba(216, 189, 115, 0.16), transparent 30%),
      radial-gradient(circle at 84% 16%, rgba(23, 91, 60, 0.42), transparent 34%),
      radial-gradient(circle at 52% 92%, rgba(216, 189, 115, 0.08), transparent 38%),
      linear-gradient(135deg, #020806 0%, #082016 38%, #04140f 72%, #010403 100%);
    font-family: 'Noto Serif SC', serif;
    color: #fff7df;
    padding: 20px;
    position: relative;
    isolation: isolate;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  body::before {
    z-index: 0;
    opacity: 0.28;
    background-image:
      url("data:image/svg+xml,%3Csvg width='760' height='420' viewBox='0 0 760 420' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d8bd73' stroke-width='1' stroke-opacity='.42'%3E%3Cpath d='M34 330C146 242 148 88 280 68c102-16 133 78 72 114-52 31-113 4-82-36 30-39 96-24 132 35 47 77 124 115 270 38'/%3E%3Cpath d='M85 108c58 33 92 21 132-18M547 286c61-8 91-38 116-84M185 283c46-14 71-41 83-80'/%3E%3Cpath d='M216 90c-18 3-35-3-50-18M266 205c-23 16-47 20-73 11M664 201c-17-2-31-10-41-25'/%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 760px 420px;
    mix-blend-mode: screen;
  }

  body::after {
    z-index: 1;
    background:
      radial-gradient(ellipse at center, transparent 0%, transparent 58%, rgba(0, 0, 0, 0.42) 100%),
      linear-gradient(90deg, rgba(216, 189, 115, 0.08), transparent 18%, transparent 82%, rgba(216, 189, 115, 0.08));
  }

  .header {
    text-align: center;
    padding: 30px 20px;
    position: sticky;
    top: 0;
    background: rgba(1, 8, 5, 0.78);
    backdrop-filter: blur(14px) saturate(1.1);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    z-index: 100;
    border-bottom: 1px solid rgba(216,189,115,0.24);
    box-shadow: 0 18px 42px rgba(0,0,0,0.18);
    border-radius: 0 0 22px 22px;
  }

  .header .title {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    background: -webkit-linear-gradient(left, #fff8df, #d8bd73, #fff2c6) 0 0 no-repeat;
    -webkit-background-size: 200px;
    -webkit-background-clip: text;
    -webkit-text-fill-color: rgba(216, 189, 115, 0.34);
    background-clip: text;
    animation: shine 3s infinite;
    letter-spacing: clamp(3px, 1vw, 6px);
    margin-bottom: 10px;
  }

  @keyframes shine {
    0% { background-position: 0 0; }
    100% { background-position: 100% 100%; }
  }

  .header .count {
    font-size: clamp(0.9rem, 2vw, 1rem);
    color: rgba(248,237,210,0.68);
    margin-top: 8px;
  }

  .header .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    margin-top: 15px;
    padding: 8px 20px;
    background: rgba(216,189,115,0.12);
    border: 1px solid rgba(216,189,115,0.34);
    border-radius: 999px;
    color: #fff2c6;
    font-size: 0.9rem;
    text-decoration: none;
    transition: all 0.3s;
  }

  .header .back-btn:hover {
    background: rgba(216,189,115,0.22);
    border-color: rgba(255,242,198,0.56);
    transform: translateY(-2px);
  }

  .header .nav-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
  }

  .header .nav-actions .back-btn {
    margin-top: 0;
  }

  .header .write-btn {
    background: linear-gradient(135deg, rgba(216,189,115,0.28), rgba(10,61,42,0.34));
    border-color: rgba(255,242,198,0.5);
    color: #fff8df;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding-bottom: 50px;
  }

  .blessing-card {
    background:
      linear-gradient(135deg, rgba(216,189,115,0.12), rgba(3,38,27,0.48)),
      rgba(255,255,255,0.035);
    border: 1px solid rgba(216,189,115,0.32);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(12px) saturate(1.1);
    -webkit-backdrop-filter: blur(12px) saturate(1.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    animation: fadeIn 0.5s ease-out;
    box-shadow:
      0 12px 30px rgba(0,0,0,0.22),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .blessing-card:hover {
    transform: translateY(-5px);
    box-shadow:
      0 16px 38px rgba(0,0,0,0.3),
      0 0 26px rgba(216,189,115,0.14);
    border-color: rgba(255,242,198,0.52);
  }

  .blessing-card .message {
    font-size: 1rem;
    line-height: 1.7;
    color: #fff7df;
    margin-bottom: 12px;
    word-wrap: break-word;
  }

  .blessing-card .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid rgba(216,189,115,0.22);
  }

  .blessing-card .author {
    font-size: 0.9rem;
    color: #d8bd73;
    font-weight: 500;
  }

  .blessing-card .time {
    font-size: 0.8rem;
    color: rgba(248,237,210,0.52);
  }

  .loading {
    text-align: center;
    padding: 50px;
    color: rgba(248,237,210,0.68);
    font-size: 1.1rem;
  }

  .empty {
    text-align: center;
    padding: 100px 20px;
    color: rgba(248,237,210,0.68);
  }

  .empty .icon {
    font-size: 4rem;
    margin-bottom: 20px;
  }

  .empty .text {
    font-size: 1.2rem;
  }

  @media (max-width: 768px) {
    .container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">全部祝福</div>
  <div class="count" id="countText">加载中...</div>
  <div class="nav-actions">
    <a href="/" class="back-btn">← 返回首页</a>
    <a href="/write" class="back-btn write-btn">✎ 写祝福</a>
  </div>
</div>

<div class="container" id="container">
  <div class="loading">正在加载祝福...</div>
</div>

<!-- 背景音乐 -->
<audio id="bgMusic" loop>
  <source src="/assets/交换余生.mp3" type="audio/mpeg">
</audio>

<script>
  const container = document.getElementById('container');
  const countText = document.getElementById('countText');

  function formatTime(timestamp) {
    if (!timestamp) return '未知时间';

    const date = new Date(timestamp);
    if (isNaN(date.getTime())) return '未知时间';

    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);

    if (minutes < 1) return '刚刚';
    if (minutes < 60) return `${minutes}分钟前`;
    if (hours < 24) return `${hours}小时前`;
    if (days < 7) return `${days}天前`;

    return date.toLocaleDateString('zh-CN', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function loadAllBlessings() {
    try {
      const res = await fetch('/api/blessings?limit=1000');
      const data = await res.json();
      const blessings = data.blessings;

      if (blessings.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="icon">💌</div>
            <div class="text">还没有收到祝福</div>
          </div>
        `;
        countText.textContent = '暂无祝福';
        return;
      }

      countText.textContent = `共收到 ${data.total} 条祝福`;

      // 按时间倒序显示（最新的在前）
      const sortedBlessings = blessings;

      container.innerHTML = sortedBlessings.map(b => `
        <div class="blessing-card">
          <div class="message">"${escapeHtml(b.message)}"</div>
          <div class="footer">
            <div class="author">—— ${escapeHtml(b.name)}</div>
            <div class="time">${formatTime(b.time)}</div>
          </div>
        </div>
      `).join('');

    } catch (e) {
      container.innerHTML = `
        <div class="empty">
          <div class="icon">😢</div>
          <div class="text">加载失败，请刷新重试</div>
        </div>
      `;
      console.error('加载失败:', e);
    }
  }

  loadAllBlessings();

  // 背景音乐 - 跨页面同步
  const bgMusic = document.getElementById('bgMusic');

  function syncMusicState() {
    const musicState = localStorage.getItem('bgMusicPlaying');
    const musicTime = parseFloat(localStorage.getItem('bgMusicTime') || '0');

    if (musicState === 'true') {
      bgMusic.currentTime = musicTime;
      bgMusic.play().catch(err => console.log('音乐播放需要用户交互:', err));
    }
  }

  function startMusic() {
    bgMusic.play().then(() => {
      localStorage.setItem('bgMusicPlaying', 'true');
    }).catch(err => {
      console.log('音乐播放需要用户交互:', err);
    });
  }

  // 定期保存播放进度
  setInterval(() => {
    if (!bgMusic.paused) {
      localStorage.setItem('bgMusicTime', bgMusic.currentTime.toString());
    }
  }, 1000);

  // 页面卸载时保存状态
  window.addEventListener('beforeunload', () => {
    if (!bgMusic.paused) {
      localStorage.setItem('bgMusicPlaying', 'true');
      localStorage.setItem('bgMusicTime', bgMusic.currentTime.toString());
    }
  });

  // 尝试恢复音乐状态
  syncMusicState();

  // 如果音乐未播放，等待用户交互
  if (localStorage.getItem('bgMusicPlaying') !== 'true') {
    document.addEventListener('click', startMusic, { once: true });
    document.addEventListener('touchstart', startMusic, { once: true });
  }
</script>
</body>
</html>
