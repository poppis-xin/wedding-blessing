<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>写下你的祝福 💌</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #1a0a1e 0%, #2d1b3d 50%, #1a0a2e 100%);
    font-family: 'Noto Serif SC', serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 飘落花瓣 */
  .petal {
    position: fixed;
    top: -20px;
    font-size: 1.2rem;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0.6; }
    25% { transform: translateY(25vh) rotate(90deg) translateX(30px); }
    50% { transform: translateY(50vh) rotate(180deg) translateX(-20px); }
    75% { transform: translateY(75vh) rotate(270deg) translateX(25px); }
    100% { transform: translateY(105vh) rotate(360deg) translateX(-10px); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
  }

  .title {
    text-align: center;
    margin-bottom: 35px;
  }

  .title .icon { font-size: 3rem; margin-bottom: 12px; }

  .title h1 {
    font-size: 1.8rem;
    background: linear-gradient(135deg, #ff6b9d, #ffa8c5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 4px;
  }

  .title .couple {
    font-size: 1.1rem;
    color: #d4a0b9;
    margin-top: 8px;
    letter-spacing: 3px;
  }

  .form-card {
    background: linear-gradient(135deg, rgba(255,107,157,0.12), rgba(255,168,197,0.06));
    border: 1px solid rgba(255,107,157,0.25);
    border-radius: 24px;
    padding: 30px 25px;
    backdrop-filter: blur(10px);
  }

  .field {
    margin-bottom: 22px;
  }

  .field label {
    display: block;
    font-size: 0.95rem;
    color: #d4a0b9;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .field input, .field textarea {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,107,157,0.3);
    border-radius: 14px;
    padding: 14px 18px;
    color: #fff;
    font-family: 'Noto Serif SC', serif;
    font-size: 1rem;
    outline: none;
    transition: all 0.3s;
  }

  .field input:focus, .field textarea:focus {
    border-color: #ff6b9d;
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 20px rgba(255,107,157,0.15);
  }

  .field input::placeholder, .field textarea::placeholder {
    color: rgba(212,160,185,0.5);
  }

  .field textarea {
    height: 140px;
    resize: none;
    line-height: 1.7;
  }

  .char-count {
    text-align: right;
    font-size: 0.8rem;
    color: rgba(212,160,185,0.5);
    margin-top: 6px;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Noto Serif SC', serif;
    font-size: 1.1rem;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255,107,157,0.4);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* 成功提示 */
  .success-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(13,13,26,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .success-overlay.show {
    display: flex;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .success-box {
    text-align: center;
    animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes bounceIn {
    0% { transform: scale(0); }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .success-box .check { font-size: 4rem; margin-bottom: 15px; }
  .success-box .msg {
    font-size: 1.3rem;
    color: #ffa8c5;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .success-box .sub {
    font-size: 0.9rem;
    color: #d4a0b9;
  }

  .success-box .again-btn {
    margin-top: 25px;
    padding: 12px 30px;
    background: rgba(255,107,157,0.2);
    border: 1px solid rgba(255,107,157,0.4);
    border-radius: 12px;
    color: #ffa8c5;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s;
  }

  .success-box .again-btn:hover {
    background: rgba(255,107,157,0.3);
  }

  .error-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(255,80,80,0.9);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 0.95rem;
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(10px);
  }

  .error-toast.show {
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">
    <div class="icon">💌</div>
    <h1>写下你的祝福</h1>
    <div class="couple">王涛 & 恬恬</div>
  </div>

  <div class="form-card">
    <div class="field">
      <label>你的名字</label>
      <input type="text" id="nameInput" placeholder="怎么称呼你~" maxlength="20" autocomplete="off">
    </div>

    <div class="field">
      <label>祝福语</label>
      <textarea id="msgInput" placeholder="写下你对新人的美好祝愿..." maxlength="200"></textarea>
      <div class="char-count"><span id="charCount">0</span>/200</div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitBlessing()">
      送出祝福 💕
    </button>
  </div>
</div>

<!-- 成功弹窗 -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="check">🎉</div>
    <div class="msg">祝福已送达</div>
    <div class="sub">感谢你的美好祝愿~</div>
    <button class="again-btn" onclick="writeAgain()">再写一条</button>
  </div>
</div>

<!-- 错误提示 -->
<div class="error-toast" id="errorToast"></div>

<script>
  // 飘落花瓣
  function createPetals() {
    const petals = ['🌸', '🌹', '💕', '✨', '♥', '🌺', '💮'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = petals[Math.floor(Math.random() * petals.length)];
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        animation-duration: ${Math.random() * 8 + 6}s;
        animation-delay: ${Math.random() * 10}s;
        font-size: ${Math.random() * 10 + 10}px;
      `;
      document.body.appendChild(p);
    }
  }
  createPetals();

  // 字数统计
  const msgInput = document.getElementById('msgInput');
  const charCount = document.getElementById('charCount');
  msgInput.addEventListener('input', () => {
    charCount.textContent = msgInput.value.length;
  });

  function showError(msg) {
    const toast = document.getElementById('errorToast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  async function submitBlessing() {
    const name = document.getElementById('nameInput').value.trim();
    const message = msgInput.value.trim();

    if (!name) { showError('请输入你的名字哦~'); return; }
    if (!message) { showError('写点祝福语吧~'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '发送中...';

    try {
      const res = await fetch('/api/blessings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, message })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('successOverlay').classList.add('show');
        document.getElementById('nameInput').value = '';
        msgInput.value = '';
        charCount.textContent = '0';
      } else {
        showError(data.error || '发送失败，请重试~');
      }
    } catch (e) {
      showError('网络开小差了，请重试~');
    }

    btn.disabled = false;
    btn.textContent = '送出祝福 💕';
  }

  function writeAgain() {
    document.getElementById('successOverlay').classList.remove('show');
    document.getElementById('msgInput').focus();
  }

  // Enter 键提交
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitBlessing();
    }
  });
</script>
</body>
</html>
