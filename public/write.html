<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>写下你的祝福</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html,
  body {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 18% 14%, rgba(255, 255, 255, 0.45), transparent 32%),
      radial-gradient(circle at 86% 18%, rgba(183, 110, 121, 0.16), transparent 30%),
      radial-gradient(circle at 50% 92%, rgba(255, 255, 255, 0.34), transparent 42%),
      linear-gradient(180deg, #FFF5F6 0%, #FDE9EB 100%);
    font-family: 'Noto Serif SC', serif;
    color: #5C4A4D;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  body::before {
    z-index: 0;
    opacity: 0.24;
    background-image:
      url("data:image/svg+xml,%3Csvg width='760' height='420' viewBox='0 0 760 420' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23e0a9af' stroke-width='1' stroke-opacity='.5'%3E%3Cpath d='M34 330C146 242 148 88 280 68c102-16 133 78 72 114-52 31-113 4-82-36 30-39 96-24 132 35 47 77 124 115 270 38'/%3E%3Cpath d='M85 108c58 33 92 21 132-18M547 286c61-8 91-38 116-84M185 283c46-14 71-41 83-80'/%3E%3Cpath d='M216 90c-18 3-35-3-50-18M266 205c-23 16-47 20-73 11M664 201c-17-2-31-10-41-25'/%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 760px 420px;
    mix-blend-mode: screen;
  }

  body::after {
    z-index: 1;
    background:
      radial-gradient(ellipse at center, transparent 0%, transparent 58%, rgba(183, 110, 121, 0.08) 100%),
      linear-gradient(90deg, rgba(255, 255, 255, 0.28), transparent 18%, transparent 82%, rgba(224, 169, 175, 0.18));
  }

  .petal {
    position: fixed;
    top: -20px;
    width: var(--size, 3px);
    height: var(--size, 3px);
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #E0A9AF 58%, rgba(224, 169, 175, 0) 72%);
    box-shadow: 0 0 12px rgba(183, 110, 121, 0.36);
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 2;
    opacity: 0.74;
    color: transparent;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) translateX(0) scale(0.7); opacity: 0; }
    12% { opacity: 0.78; }
    55% { transform: translateY(54vh) translateX(-18px) scale(1); }
    100% { transform: translateY(105vh) translateX(20px) scale(0.8); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
  }

  .title {
    text-align: center;
    margin-bottom: 35px;
  }

  .title .loader {
    width: 68px;
    height: 46px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    filter: drop-shadow(0 0 14px rgba(183, 110, 121, 0.24));
  }

  .title .star {
    opacity: 0;
    fill: #B76E79;
    flex: 0 0 auto;
    animation: starLoader 2s infinite alternate;
  }

  .title .star2 {
    width: 20px;
    height: 20px;
    margin-left: -10px;
    animation-delay: 0.25s;
  }

  .title .star3 {
    width: 16px;
    height: 16px;
    margin-left: -15px;
    animation-delay: 0.5s;
  }

  @keyframes starLoader {
    0% {
      opacity: 0;
      transform: translateY(0) translateX(50px) rotate(0deg);
    }

    10% {
      opacity: 0;
      transform: translateY(0) translateX(50px) rotate(0deg);
    }

    100% {
      opacity: 1;
      transform: translateY(-20px) translateX(0) rotate(360deg);
    }
  }

  .title h1 {
    font-size: 1.8rem;
    color: #8D5B61;
    background: none;
    -webkit-background-clip: initial;
    -webkit-text-fill-color: currentColor;
    letter-spacing: 4px;
  }

  .title .couple {
    font-size: 1.1rem;
    color: #8D5B61;
    margin-top: 8px;
    letter-spacing: 3px;
  }

  .form-card {
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid #FFFFFF;
    border-radius: 16px;
    padding: 30px 25px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 14px 42px rgba(205, 160, 165, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.68);
  }

  .field { margin-bottom: 22px; }

  .field label {
    display: block;
    font-size: 0.95rem;
    color: #A68B8E;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: rgba(255, 255, 255, 0.34);
    border: 1px solid rgba(141, 91, 97, 0.2);
    border-radius: 14px;
    padding: 14px 18px;
    color: #5C4A4D;
    caret-color: #B76E79;
    font-family: 'Noto Serif SC', serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
  }

  .field input:focus,
  .field textarea:focus {
    border-color: #B76E79;
    background: rgba(255, 255, 255, 0.56);
    box-shadow:
      0 0 0 1px rgba(183, 110, 121, 0.12),
      0 0 20px rgba(183, 110, 121, 0.16);
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: #A68B8E;
  }

  .field textarea {
    height: 140px;
    resize: none;
    line-height: 1.7;
  }

  .char-count {
    text-align: right;
    font-size: 0.8rem;
    color: #A68B8E;
    margin-top: 6px;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #B76E79 0%, #E0A9AF 52%, #D8BD73 100%);
    border: 1px solid rgba(255, 255, 255, 0.76);
    border-radius: 14px;
    color: #FFFFFF;
    font-family: 'Noto Serif SC', serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow:
      0 12px 30px rgba(183, 110, 121, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.32);
    transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease, background 0.3s ease, color 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    color: #FFFFFF;
    background: linear-gradient(135deg, #C58386 0%, #E8B8BE 52%, #E0C682 100%);
    box-shadow:
      0 14px 34px rgba(183, 110, 121, 0.28),
      0 0 24px rgba(255, 255, 255, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.38);
  }

  .submit-btn:active {
    transform: translateY(0);
    color: #FFFFFF;
    background: linear-gradient(135deg, #A95F6A 0%, #D99BA3 52%, #CFAA63 100%);
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .success-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(1, 8, 5, 0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .success-overlay.show {
    display: flex;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .success-box {
    text-align: center;
    padding: 26px;
    animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes bounceIn {
    0% { transform: scale(0); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .success-box .check {
    width: 58px;
    height: 58px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 26%, #fff8df 0 12%, transparent 18%), linear-gradient(135deg, #fff2c6, #d8bd73);
    color: transparent;
    box-shadow: 0 0 28px rgba(216,189,115,0.34);
  }

  .success-box .msg {
    font-size: 1.3rem;
    color: #fff2c6;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .success-box .sub {
    font-size: 0.9rem;
    color: rgba(248,237,210,0.7);
  }

  .success-box .again-btn,
  .success-box .wall-btn,
  .page-nav a {
    border-radius: 999px;
    font-family: 'Noto Serif SC', serif;
    text-decoration: none;
    transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    backdrop-filter: blur(10px) saturate(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
  }

  .success-box .again-btn,
  .success-box .wall-btn {
    display: block;
    width: min(240px, 100%);
    margin: 12px auto 0;
    padding: 12px 30px;
    background: rgba(216,189,115,0.12);
    border: 1px solid rgba(216,189,115,0.34);
    color: #fff2c6;
    font-size: 0.95rem;
    text-align: center;
    cursor: pointer;
  }

  .success-box .again-btn { margin-top: 25px; }

  .success-box .again-btn:hover,
  .success-box .wall-btn:hover {
    background: rgba(216,189,115,0.22);
    border-color: rgba(255,242,198,0.56);
  }

  .page-nav {
    position: fixed;
    top: 20px;
    left: 50%;
    z-index: 100;
    display: flex;
    gap: 10px;
    transform: translateX(-50%);
  }

  .page-nav a {
    min-height: 40px;
    padding: 10px 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(141, 91, 97, 0.28);
    border-radius: 999px;
    color: #8D5B61;
    font-size: 0.9rem;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(205, 160, 165, 0.14);
  }

  .page-nav a:hover {
    background: rgba(255, 255, 255, 0.64);
    border-color: rgba(141, 91, 97, 0.42);
    color: #8D5B61;
    transform: translateY(-2px);
  }

  .error-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(127, 34, 28, 0.92);
    color: #fff;
    padding: 12px 24px;
    border: 1px solid rgba(255,242,198,0.24);
    border-radius: 12px;
    font-size: 0.95rem;
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(10px);
  }

  .error-toast.show {
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 520px) {
    body {
      justify-content: flex-start;
      padding-top: calc(96px + env(safe-area-inset-top));
      padding-bottom: 28px;
    }

    .page-nav {
      top: calc(18px + env(safe-area-inset-top));
      width: calc(100% - 24px);
      justify-content: center;
      gap: 8px;
    }

    .page-nav a {
      flex: 1 1 0;
      max-width: 150px;
      min-height: 38px;
      padding: 9px 10px;
      font-size: 0.82rem;
    }
  }
</style>
</head>
<body>

<nav class="page-nav" aria-label="页面导航">
  <a href="/">← 返回首页</a>
  <a href="/all-blessings">查看全部</a>
</nav>

<!-- 背景音乐 -->
<audio id="bgMusic" loop>
  <source src="/assets/交换余生.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="title">
    <div class="loader" aria-hidden="true">
      <svg viewBox="0 0 256 256" class="star star1" height="32" width="32" xmlns="http://www.w3.org/2000/svg">
        <path d="M234.5,114.38l-45.1,39.36,13.51,58.6a16,16,0,0,1-23.84,17.34l-51.11-31-51,31a16,16,0,0,1-23.84-17.34L66.61,153.8,21.5,114.38a16,16,0,0,1,9.11-28.06l59.46-5.15,23.21-55.36a15.95,15.95,0,0,1,29.44,0h0L166,81.17l59.44,5.15a16,16,0,0,1,9.11,28.06Z"></path>
      </svg>
      <svg viewBox="0 0 256 256" class="star star2" height="32" width="32" xmlns="http://www.w3.org/2000/svg">
        <path d="M234.5,114.38l-45.1,39.36,13.51,58.6a16,16,0,0,1-23.84,17.34l-51.11-31-51,31a16,16,0,0,1-23.84-17.34L66.61,153.8,21.5,114.38a16,16,0,0,1,9.11-28.06l59.46-5.15,23.21-55.36a15.95,15.95,0,0,1,29.44,0h0L166,81.17l59.44,5.15a16,16,0,0,1,9.11,28.06Z"></path>
      </svg>
      <svg viewBox="0 0 256 256" class="star star3" height="32" width="32" xmlns="http://www.w3.org/2000/svg">
        <path d="M234.5,114.38l-45.1,39.36,13.51,58.6a16,16,0,0,1-23.84,17.34l-51.11-31-51,31a16,16,0,0,1-23.84-17.34L66.61,153.8,21.5,114.38a16,16,0,0,1,9.11-28.06l59.46-5.15,23.21-55.36a15.95,15.95,0,0,1,29.44,0h0L166,81.17l59.44,5.15a16,16,0,0,1,9.11,28.06Z"></path>
      </svg>
    </div>
    <h1>写下你的祝福</h1>
    <div class="couple">王涛 & 鲁恬恬</div>
  </div>

  <div class="form-card">
    <div class="field">
      <label>你的名字</label>
      <input type="text" id="nameInput" placeholder="怎么称呼你~" maxlength="20" autocomplete="off">
    </div>

    <div class="field">
      <label>祝福语</label>
      <textarea id="msgInput" placeholder="写下你对新人的美好祝愿..." maxlength="52"></textarea>
      <div class="char-count"><span id="charCount">0</span>/52</div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitBlessing()">
      送出祝福
    </button>
  </div>
</div>

<!-- 成功弹窗 -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="check" aria-hidden="true"></div>
    <div class="msg">祝福已送达</div>
    <div class="sub">感谢你的美好祝愿~</div>
    <button class="again-btn" onclick="writeAgain()">再写一条</button>
    <a class="wall-btn" href="/">返回首页</a>
    <a class="wall-btn" href="/all-blessings">查看全部祝福</a>
  </div>
</div>

<!-- 错误提示 -->
<div class="error-toast" id="errorToast"></div>

<script>
  // 香槟金微粒
  function createPetals() {
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const size = Math.random() * 3 + 2;
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        animation-duration: ${Math.random() * 8 + 6}s;
        animation-delay: ${Math.random() * 10}s;
        --size: ${size}px;
      `;
      document.body.appendChild(p);
    }
  }
  createPetals();

  // 字数统计
  const msgInput = document.getElementById('msgInput');
  const charCount = document.getElementById('charCount');
  msgInput.addEventListener('input', () => {
    charCount.textContent = msgInput.value.length;
  });

  function showError(msg) {
    const toast = document.getElementById('errorToast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  async function submitBlessing() {
    const name = document.getElementById('nameInput').value.trim();
    const message = msgInput.value.trim();

    if (!name) { showError('请输入你的名字哦~'); return; }
    if (!message) { showError('写点祝福语吧~'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '发送中...';

    try {
      const res = await fetch('/api/blessings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, message })
      });
      const data = await res.json();

      if (data.success) {
        // 显示成功提示
        const toast = document.getElementById('errorToast');
        toast.textContent = '发送成功，正在上墙！';
        toast.style.background = 'linear-gradient(135deg, rgba(216,189,115,0.95), rgba(155,123,56,0.95))';
        toast.classList.add('show');

        // 2秒后跳转到主页
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } else {
        showError(data.error || '发送失败，请重试~');
        btn.disabled = false;
        btn.textContent = '送出祝福';
      }
    } catch (e) {
      showError('网络开小差了，请重试~');
      btn.disabled = false;
      btn.textContent = '送出祝福';
    }
  }

  function writeAgain() {
    document.getElementById('successOverlay').classList.remove('show');
    document.getElementById('msgInput').focus();
  }

  // Enter 键提交
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitBlessing();
    }
  });
</script>
<script src="/music.js"></script>
</body>
</html>
