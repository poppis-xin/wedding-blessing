<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="preload" as="image" href="/assets/1.jpg" fetchpriority="high">
  <title>新郎XX & 新娘XX 的婚礼祝福</title>
  <style>
    /* 基础重置与防溢出 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background-color: #020806;
      /* 深祖母绿森林背景 */
      /* 极简星空背景点缀 */
      background-image:
        radial-gradient(1px 1px at 25px 30px, rgba(255, 242, 198, 0.78), rgba(0, 0, 0, 0)),
        radial-gradient(1px 1px at 50px 70px, rgba(216, 189, 115, 0.58), rgba(0, 0, 0, 0)),
        radial-gradient(1.5px 1.5px at 90px 150px, rgba(255, 248, 223, 0.88), rgba(0, 0, 0, 0)),
        radial-gradient(2px 2px at 160px 120px, rgba(216, 189, 115, 0.48), rgba(0, 0, 0, 0));
      background-size: 200px 200px;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      /* 关键：切断一切导致诡异白边的溢出 */
      position: relative;
    }

    .photo-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #020806;
    }

    .photo-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(2, 8, 6, 0.08), rgba(2, 8, 6, 0.16)),
        radial-gradient(circle at 50% 42%, rgba(216, 189, 115, 0.04), rgba(2, 8, 6, 0.08) 58%, rgba(2, 8, 6, 0.2));
    }

    .photo-bg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      opacity: 0;
      transform: scale(1.035);
      filter: brightness(1.24) saturate(1.08) contrast(1.04);
      animation: photoFade 48s ease-in-out infinite;
      will-change: opacity;
    }

    .photo-bg img:nth-child(1) {
      opacity: 1;
      animation-delay: -1.2s;
    }
    .photo-bg img:nth-child(2) { animation-delay: 6s; }
    .photo-bg img:nth-child(3) { animation-delay: 12s; }
    .photo-bg img:nth-child(4) { animation-delay: 18s; }
    .photo-bg img:nth-child(5) { animation-delay: 24s; }
    .photo-bg img:nth-child(6) { animation-delay: 30s; }
    .photo-bg img:nth-child(7) { animation-delay: 36s; }
    .photo-bg img:nth-child(8) { animation-delay: 42s; }

    @media (max-width: 520px) {
      .photo-bg img {
        object-position: center center;
      }
    }

    @keyframes photoFade {
      0%,
      3% {
        opacity: 0;
      }

      7%,
      20% {
        opacity: 1;
      }

      24%,
      100% {
        opacity: 0;
      }
    }

    /* 真正的高级环境光晕 */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      /* 极度模糊，变成一团柔光 */
      z-index: 1;
      opacity: 0.24;
      animation: breathe 8s ease-in-out infinite alternate;
    }

    .orb-emerald {
      width: 35vw;
      height: 35vw;
      background: rgba(29, 103, 68, 0.42);
      /* 深森林绿 */
      top: -5%;
      left: -5%;
    }

    .orb-gold {
      width: 30vw;
      height: 30vw;
      background: rgba(216, 189, 115, 0.18);
      /* 香槟金光晕 */
      bottom: -5%;
      right: -5%;
    }

    .vine-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: none;
      opacity: 0;
      background-image:
        url("data:image/svg+xml,%3Csvg width='760' height='420' viewBox='0 0 760 420' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d8bd73' stroke-width='1' stroke-opacity='.42'%3E%3Cpath d='M34 330C146 242 148 88 280 68c102-16 133 78 72 114-52 31-113 4-82-36 30-39 96-24 132 35 47 77 124 115 270 38'/%3E%3Cpath d='M85 108c58 33 92 21 132-18M547 286c61-8 91-38 116-84M185 283c46-14 71-41 83-80'/%3E%3Cpath d='M216 90c-18 3-35-3-50-18M266 205c-23 16-47 20-73 11M664 201c-17-2-31-10-41-25'/%3E%3C/g%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 760px 420px;
      mix-blend-mode: screen;
    }

    .page-shell {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #020806;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.36s ease;
    }

    .page-shell iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #020806;
    }

    body.is-shell-open .page-shell {
      opacity: 1;
      pointer-events: auto;
    }

    body.is-shell-open .glass-card {
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, calc(-50% + 10px), 0) scale(0.98);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    @keyframes breathe {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }

      100% {
        transform: scale(1.1);
        opacity: 0.7;
      }
    }

    @property --flow-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    /* 极简通透玻璃卡片 */
    .glass-card {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 10;
      width: min(78vw, 340px);
      max-width: 340px;
      /* 限制手机端最大宽度，显得精致 */
      padding: 34px 26px;
      border-radius: 24px;
      text-align: center;
      overflow: hidden;
      isolation: isolate;
      transform: translate3d(-50%, -50%, 0);
      transform-origin: center;
      transition: opacity 0.24s ease, transform 0.24s ease;

      /* 核心玻璃质感参数 */
      background: rgba(255, 255, 255, 0.01);
      /* 极低的白底 */
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow:
        0 18px 34px rgba(0, 0, 0, 0.18),
        0 0 18px rgba(216, 189, 115, 0.08);
    }

    .glass-card::before {
      content: "";
      --flow-angle: 0deg;
      position: absolute;
      z-index: 0;
      inset: 0;
      padding: 2px;
      border-radius: inherit;
      background:
        conic-gradient(from var(--flow-angle),
          transparent 0deg,
          transparent 42deg,
          rgba(255, 255, 255, 0.96) 50deg,
          rgba(216, 189, 115, 0.98) 64deg,
          rgba(255, 242, 198, 0.9) 78deg,
          transparent 96deg,
          transparent 180deg,
          rgba(216, 189, 115, 0.18) 205deg,
          rgba(216, 189, 115, 0.82) 224deg,
          transparent 250deg,
          transparent 360deg);
      filter: drop-shadow(0 0 8px rgba(216, 189, 115, 0.42));
      opacity: 0.42;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: exclude;
      animation: cardBorderSweep 4.8s linear infinite;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 5px;
      border-radius: 19px;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.035), rgba(2, 12, 9, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.18),
        inset 0 -18px 38px rgba(0, 0, 0, 0.04);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .glass-card > * {
      position: relative;
      z-index: 2;
    }

    @keyframes cardBorderSweep {
      to {
        --flow-angle: 360deg;
      }
    }

    .rings-icon {
      width: 54px;
      height: 38px;
      margin: 0 auto 18px;
      position: relative;
      filter: drop-shadow(0 10px 18px rgba(216, 189, 115, 0.28));
      animation: floatRings 3s ease-in-out infinite;
    }

    .rings-icon::before,
    .rings-icon::after {
      content: "";
      position: absolute;
      width: 32px;
      height: 32px;
      top: 3px;
      border-radius: 50%;
      border: 3px solid rgba(255, 242, 198, 0.86);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(216, 189, 115, 0.18)),
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.95), transparent 28%);
      box-shadow:
        inset 0 0 10px rgba(255, 255, 255, 0.18),
        0 0 24px rgba(216, 189, 115, 0.28);
    }

    .rings-icon::before {
      left: 3px;
      transform: rotate(-14deg);
    }

    .rings-icon::after {
      right: 3px;
      transform: rotate(14deg);
      border-color: rgba(255, 242, 198, 0.92);
    }

    @keyframes floatRings {

      0%,
      100% {
        transform: translateY(0) rotate(-1deg);
      }

      50% {
        transform: translateY(-7px) rotate(1deg);
      }
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.56);
    }

    .intro {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 36px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.54);
    }

    /* 按钮组 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      z-index: 4;
    }

    .blessing-button {
      --primary: #d8bd73;
      --neutral-1: #fff8df;
      --neutral-2: #efe4c1;
      --radius: 16px;
      --button-text: #183225;

      min-width: min(100%, 236px);
      height: 64px;
      padding: 18px 28px;
      border: none;
      border-radius: var(--radius);
      color: var(--button-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: visible;
      text-decoration: none;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.65);
      box-shadow:
        0 0.5px 0.5px 1px rgba(255, 255, 255, 0.28),
        0 15px 28px rgba(0, 0, 0, 0.26),
        0 5px 9px rgba(216, 189, 115, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      z-index: 1;
    }

    .blessing-button--wall {
      --primary: #d8bd73;
      --neutral-1: #fff8df;
      --neutral-2: #e9d9a6;
      --button-text: #173226;
    }

    .blessing-button:hover {
      transform: scale(1.02);
      box-shadow:
        0 0 1px 2px rgba(255, 255, 255, 0.28),
        0 18px 32px rgba(0, 0, 0, 0.32),
        0 12px 24px rgba(216, 189, 115, 0.16);
    }

    .blessing-button:active {
      transform: scale(0.99);
      box-shadow:
        0 0 1px 2px rgba(255, 255, 255, 0.24),
        0 10px 18px rgba(0, 0, 0, 0.25);
    }

    .blessing-button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.72);
      outline-offset: 5px;
    }

    .blessing-button::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      border: 2.5px solid transparent;
      background:
        linear-gradient(var(--neutral-1), var(--neutral-2)) padding-box,
        linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(2, 31, 20, 0.42)) border-box;
      z-index: 0;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .blessing-button:hover::after,
    .blessing-button.is-sending::after {
      transform: scale(1.045, 1.1);
      box-shadow: inset 0 -1px 3px rgba(255, 255, 255, 0.95);
    }

    .blessing-button::before {
      content: "";
      inset: 7px 7px 6px;
      position: absolute;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.86), rgba(239, 228, 193, 0.9));
      border-radius: 999px;
      filter: blur(0.5px);
      z-index: 2;
    }

    .blessing-button--wall::before {
      background: linear-gradient(to top, rgba(255, 255, 255, 0.9), rgba(233, 217, 166, 0.9));
    }

    .button-outline {
      position: absolute;
      border-radius: inherit;
      inset: -2px -3.5px;
      overflow: hidden;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .button-outline::before {
      content: "";
      position: absolute;
      inset: -100%;
      background: conic-gradient(from 180deg, transparent 60%, rgba(255, 255, 255, 0.95) 80%, transparent 100%);
      animation: spin 2s linear infinite;
      animation-play-state: paused;
    }

    .blessing-button:hover .button-outline,
    .blessing-button.is-sending .button-outline {
      opacity: 1;
    }

    .blessing-button:hover .button-outline::before,
    .blessing-button.is-sending .button-outline::before {
      animation-play-state: running;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .button-state {
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding-left: 30px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .button-label {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-state .button-icon {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      margin: auto;
      transform: scale(1.24);
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-state .button-icon svg {
      width: 1em;
      height: 1em;
      overflow: visible;
      filter: drop-shadow(0 1px 0.6px rgba(0, 0, 0, 0.35));
    }

    .button-label span {
      display: block;
      opacity: 0;
      animation: slideDown 0.8s ease forwards calc(var(--i) * 0.03s);
    }

    .blessing-button:hover .button-label span {
      opacity: 1;
      animation: wave 0.5s ease forwards calc(var(--i) * 0.02s);
    }

    .blessing-button.is-sending .button-state--default .button-label span {
      opacity: 1;
      animation: disappear 0.58s ease forwards calc(var(--i) * 0.03s);
    }

    @keyframes wave {
      30% {
        opacity: 1;
        transform: translateY(4px);
      }

      50% {
        opacity: 1;
        transform: translateY(-3px);
        color: var(--primary);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideDown {
      0% {
        opacity: 0;
        transform: translateY(-20px) translateX(5px) rotate(-90deg);
        color: var(--primary);
        filter: blur(5px);
      }

      30% {
        opacity: 1;
        transform: translateY(4px) translateX(0) rotate(0);
        filter: blur(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-3px) translateX(0) rotate(0);
      }

      100% {
        opacity: 1;
        transform: translateY(0) translateX(0) rotate(0);
      }
    }

    @keyframes disappear {
      to {
        opacity: 0;
        transform: translateX(5px) translateY(20px);
        color: var(--primary);
        filter: blur(5px);
      }
    }

    .button-state--default .button-icon svg {
      animation: land 0.6s ease forwards;
    }

    .blessing-button:hover .button-state--default .button-icon {
      transform: rotate(45deg) scale(1.24);
    }

    .blessing-button.is-sending .button-state--default svg {
      animation: takeOff 0.8s linear forwards;
    }

    .blessing-button.is-sending .button-state--default .button-icon {
      transform: rotate(0) scale(1.24);
    }

    @keyframes takeOff {
      0% {
        opacity: 1;
      }

      60% {
        opacity: 1;
        transform: translateX(70px) rotate(45deg) scale(2);
      }

      100% {
        opacity: 0;
        transform: translateX(160px) rotate(45deg) scale(0);
      }
    }

    @keyframes land {
      0% {
        transform: translateX(-60px) translateY(30px) rotate(-50deg) scale(2);
        opacity: 0;
        filter: blur(3px);
      }

      100% {
        transform: translateX(0) translateY(0) rotate(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    .button-state--default .button-icon::before {
      content: "";
      position: absolute;
      top: 50%;
      left: -5px;
      height: 2px;
      width: 0;
      background: linear-gradient(to right, transparent, rgba(57, 33, 43, 0.48));
    }

    .blessing-button.is-sending .button-state--default .button-icon::before {
      animation: contrail 0.8s linear forwards;
    }

    @keyframes contrail {
      0% {
        width: 0;
        opacity: 1;
      }

      8% {
        width: 15px;
      }

      60% {
        opacity: 0.7;
        width: 80px;
      }

      100% {
        opacity: 0;
        width: 160px;
      }
    }

    .button-state--sent {
      display: none;
    }

    .button-state--sent .button-icon svg {
      transform: scale(1.25);
    }

    .blessing-button.is-sending .button-state--default {
      position: absolute;
    }

    .blessing-button.is-sending .button-state--sent {
      display: flex;
    }

    .blessing-button.is-sending .button-state--sent .button-label span {
      opacity: 0;
      animation: slideDown 0.8s ease forwards calc(var(--i) * 0.12s);
    }

    .blessing-button.is-sending .button-state--sent .button-icon svg {
      opacity: 0;
      animation: appear 1.1s ease forwards 0.55s;
    }

    @keyframes appear {
      0% {
        opacity: 0;
        transform: scale(4) rotate(-40deg);
        color: var(--primary);
        filter: blur(4px);
      }

      30% {
        opacity: 1;
        transform: scale(0.6);
        filter: blur(1px);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 420px) {
      .glass-card {
        width: min(76vw, 300px);
        padding: 26px 18px;
      }

      .intro {
        margin-bottom: 26px;
      }

      .btn-group {
        gap: 14px;
      }

      .blessing-button {
        width: 100%;
        min-width: 0;
        height: 56px;
        padding: 14px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="photo-bg" aria-hidden="true">
    <img src="/assets/1.jpg" alt="" fetchpriority="high" decoding="async">
    <img src="/assets/2.jpg" alt="" loading="lazy" decoding="async">
    <img src="/assets/3.jpg" alt="" loading="lazy" decoding="async">
    <img src="/assets/4.jpg" alt="" loading="lazy" decoding="async">
    <img src="/assets/5.jpg" alt="" loading="lazy" decoding="async">
    <img src="/assets/6.jpg" alt="" loading="lazy" decoding="async">
    <img src="/assets/7.jpg" alt="" loading="lazy" decoding="async">
    <img src="/assets/8.jpg" alt="" loading="lazy" decoding="async">
  </div>
  <div class="vine-layer" aria-hidden="true"></div>
  <div class="glow-orb orb-emerald"></div>
  <div class="glow-orb orb-gold"></div>

  <div class="glass-card">
    <div class="rings-icon" aria-hidden="true"></div>
    <h1>新郎XX & 新娘XX</h1>
    <p class="intro">感谢每一位朋友送来的祝福<br>愿这些温柔的话语，陪新人走向更长久的以后</p>

    <div class="btn-group">
      <a href="/write.html" class="blessing-button" aria-label="送上祝福">
        <span class="button-outline" aria-hidden="true"></span>
        <span class="button-state button-state--default">
          <span class="button-icon" aria-hidden="true">

    <source src="/assets/交换余生.mp3" type="audio/mpeg">
  </audio>

  <script src="/music.js"></script>
  <script>
    const pageShell = document.getElementById('pageShell');
    const pageShellFrame = document.getElementById('pageShellFrame');
    const shellRoutes = new Set(['/','/welcome','/write','/write.html','/all-blessings','/all-blessings.html']);

    function openShell(target) {
      if (!target) return;
      document.body.classList.add('is-shell-open');
      pageShell.setAttribute('aria-hidden', 'false');
      pageShellFrame.src = target;
    }

    function clearSendingState() {
      document.querySelectorAll('.blessing-button.is-sending').forEach(button => {
        button.classList.remove('is-sending');
      });
    }

    function normalizeTarget(target) {
      if (target === '/write.html') return '/write';
      if (target === '/all-blessings.html') return '/all-blessings';
      return target;
    }

    function handleButtonClick(button, event) {
      const target = normalizeTarget(button.getAttribute('href'));
      if (!target || button.classList.contains('is-sending')) return;

      event.preventDefault();
      if (window.WeddingMusic) window.WeddingMusic.start();
      button.classList.add('is-sending');

      openShell(target);
      window.setTimeout(clearSendingState, 420);
    }

    document.querySelectorAll('.blessing-button').forEach(button => {
      button.addEventListener('click', event => handleButtonClick(button, event));
    });

    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'navigate-shell') return;
      const target = normalizeTarget(event.data.href);
      if (!shellRoutes.has(target)) return;
      if (window.WeddingMusic) window.WeddingMusic.save();
      if (target === '/welcome') {
        document.body.classList.remove('is-shell-open');
        pageShell.setAttribute('aria-hidden', 'true');
        pageShellFrame.removeAttribute('src');
        clearSendingState();
        return;
      }
      openShell(target);
    });

    if (window.WeddingMusic) {
      window.WeddingMusic.start();
    }
  </script>
